
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Review</title>
</head>
<body>
  <h2>Acme Review</h2>

  <pre id="result">Starting...</pre>

  <script>
    const output = document.getElementById("result");

    function log(message) {
      output.textContent += "\n" + message;
      console.log(message);
    }

    // iframe 내부에서 보낸 결과 받기
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) {
        return;
      }

      if (event.data?.type === "navigation-result") {
        log("Navigation result:");
        log(JSON.stringify(event.data.timing, null, 2));
      }
    });

    async function main() {
      try {
        if (!("serviceWorker" in navigator)) {
          log("Service Worker not supported");
          return;
        }

        // 1. Service Worker 등록
        await navigator.serviceWorker.register("./sw.js");
        await navigator.serviceWorker.ready;

        // 2. 페이지가 SW 제어를 받도록 새로고침
        if (!navigator.serviceWorker.controller) {
          location.reload();
          return;
        }

        output.textContent = "Service Worker ready";

        // 3. SW가 처리할 navigation 생성
        const frame = document.createElement("iframe");

        frame.src = "./probe?t=" + Date.now();

        frame.style.width = "600px";
        frame.style.height = "200px";

        document.body.appendChild(frame);

        log("Navigation started");

      } catch (error) {
        log("Main error: " + error.message);
      }
    }

    main();
  </script>
</body>
</html>
